# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/bmcp
    binary: bmcp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.buildCommit={{.Commit}}
      - -X main.buildDate={{.Date}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .Binary }}-{{ .Os }}-{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# Signing is unconditional on purpose. `bmcp update` verifies the Developer ID
# signature before replacing a darwin binary, so a release that shipped unsigned
# would be one that no installed binary can update to. Gating this on
# `isEnvSet "MACOS_SIGN_P12"` made a missing secret degrade to a successful
# unsigned release; now it fails the release instead. The release workflow
# checks the same secrets up front so the failure names the missing one.
notarize:
  macos:
    - enabled: true
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true
        timeout: 20m

brews:
  - name: bmcp
    repository:
      owner: sirob-tech
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/sirob-tech/boris-mcp-cli
    description: BORIS MCP to CLI converter
    license: Apache-2.0
    install: |
      bin.install "bmcp"
    test: |
      system "#{bin}/bmcp", "version"

release:
  github:
    owner: sirob-tech
    name: boris-mcp-cli
  # Makes re-publishing a tag idempotent. A release that failed partway leaves
  # some assets uploaded and some not; without this, the retry dies on a 422 for
  # the ones that made it, and the only way forward is deleting things by hand.
  replace_existing_artifacts: true
